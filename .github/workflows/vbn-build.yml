name: VBN build verification

on:
  push:
    branches:
      - feature/vbn-free-business-news

permissions:
  contents: read

jobs:
  build:
    name: Verify Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
